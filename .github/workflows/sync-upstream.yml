name: Sync Upstream Updates

on:
  schedule:
    # Runs automatically every day at 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync Mode (create-pr creates a review PR, auto-merge commits directly to main)'
        required: true
        type: choice
        default: 'create-pr'
        options:
          - 'create-pr'
          - 'auto-merge'
      force_sync:
        description: 'Force sync execution even if already up to date'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    name: Sync Upstream Bruno Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream and Fetch
        run: |
          git remote add upstream https://github.com/usebruno/bruno.git || git remote set-url upstream https://github.com/usebruno/bruno.git
          git fetch upstream main --no-tags
          echo "Upstream remote configured and fetched."

      - name: Check for New Commits
        id: check_updates
        run: |
          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "New upstream commits behind: $BEHIND_COUNT"
          echo "behind_count=$BEHIND_COUNT" >> $GITHUB_OUTPUT

          if [ "$BEHIND_COUNT" -eq 0 ] && [ "${{ github.event.inputs.force_sync }}" != "true" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "Repository is already up to date with upstream/main."
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "Updates found: $BEHIND_COUNT commits ahead in upstream/main."
          fi

      - name: Perform Merge and Guard Branding
        if: steps.check_updates.outputs.has_updates == 'true'
        id: merge_upstream
        run: |
          SYNC_BRANCH="sync/upstream-updates"
          git checkout -B "$SYNC_BRANCH" main

          echo "Attempting to merge upstream/main into $SYNC_BRANCH with -X ours..."
          # Merge upstream changes, auto-resolving conflicts in favor of NgaRing customizations
          git merge upstream/main -X ours --no-edit -m "chore(sync): merge upstream updates from usebruno/bruno" || true

          # Keep our version of protected branding files and workflows if conflicts occur
          git checkout HEAD -- packages/bruno-electron/package.json 2>/dev/null || true
          git checkout HEAD -- packages/bruno-electron/electron-builder-config.js 2>/dev/null || true
          git checkout HEAD -- packages/bruno-electron/resources/installer.nsh 2>/dev/null || true
          git checkout HEAD -- .github/workflows/ 2>/dev/null || true
          git checkout HEAD -- package.json 2>/dev/null || true

          # Run branding guard script to ensure all author, urls, and appIds are preserved
          node ./scripts/guard-branding.js

          git add packages/bruno-electron/package.json packages/bruno-electron/electron-builder-config.js package.json .github/ || true

          if ! git diff-index --quiet HEAD --; then
            git commit --no-verify -m "chore(branding): re-apply NgaRingApi metadata guard" || true
          fi
          echo "Merge and branding guard complete."

      - name: Install dependencies & verify tests
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          bun run setup
          bun test packages/bruno-electron/src/ipc/git.spec.js packages/bruno-app/src/utils/git/gitClient.spec.js

      - name: Apply Auto-Merge (if selected)
        if: steps.check_updates.outputs.has_updates == 'true' && github.event.inputs.mode == 'auto-merge'
        run: |
          git checkout main
          git merge sync/upstream-updates -m "chore(sync): auto-merge upstream updates from usebruno/bruno"
          git push origin main
          echo "### 🚀 Auto-Merge Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "Successfully merged ${{ steps.check_updates.outputs.behind_count }} commits from upstream/main directly into main." >> $GITHUB_STEP_SUMMARY

      - name: Create or Update Pull Request (default mode)
        if: steps.check_updates.outputs.has_updates == 'true' && github.event.inputs.mode != 'auto-merge'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git push -f origin sync/upstream-updates

          PR_BODY="### 🔄 Upstream Sync: usebruno/bruno -> NgaRingApi

          This automated sync updates NgaRingApi with the latest commits from upstream \`usebruno/bruno\`.

          #### Status:
          - **Commits merged**: ${{ steps.check_updates.outputs.behind_count }} upstream commits
          - **Branding Guard**: NgaRingApi publisher, logos, and build configuration preserved.
          - **Tests**: IPC & Git tests verified.

          #### Actions Needed:
          1. Review the changes in this PR.
          2. Merge when ready to release."

          PR_LINK="https://github.com/nyawit-dev/ngaRing-Api/pull/new/sync/upstream-updates"

          PR_NUM=$(gh pr list --head sync/upstream-updates --state open --json number -q '.[0].number' || echo "")
          if [ -n "$PR_NUM" ]; then
            echo "Updating existing PR #$PR_NUM..."
            gh pr edit "$PR_NUM" --title "chore(sync): merge upstream updates from usebruno/bruno" --body "$PR_BODY" || true
            echo "Pull request #$PR_NUM updated successfully."
          else
            echo "Creating new PR..."
            gh pr create \
              --title "chore(sync): merge upstream updates from usebruno/bruno" \
              --body "$PR_BODY" \
              --base main \
              --head sync/upstream-updates || true
          fi

          echo "### 🔄 Upstream Sync Branch Ready" >> $GITHUB_STEP_SUMMARY
          echo "Branch **sync/upstream-updates** has been updated with ${{ steps.check_updates.outputs.behind_count }} upstream commits." >> $GITHUB_STEP_SUMMARY
          echo "[**👉 Click here to review and open Pull Request**]($PR_LINK)" >> $GITHUB_STEP_SUMMARY
