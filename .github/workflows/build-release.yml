name: CI/CD Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_desktop:
        description: 'Build native desktop packages'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun run setup

      - name: Build Web Application
        run: bun run build:web

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngaringapi-web-dist
          path: packages/bruno-app/dist
          retention-days: 7

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    needs: build-web
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event.inputs.build_desktop == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact_name: NgaRingApi-Windows-Installer
          - os: macos-latest
            platform: mac
            artifact_name: NgaRingApi-macOS-Installer
          - os: ubuntu-latest
            platform: linux
            artifact_name: NgaRingApi-Linux-Packages
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun run setup

      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ngaringapi-web-dist
          path: packages/bruno-app/dist

      - name: Verify or Build Web Assets
        shell: bash
        run: |
          if [ ! -f "packages/bruno-app/dist/index.html" ]; then
            echo "Web build not found in artifact, compiling web assets..."
            bun run build:web
          else
            echo "Web build successfully restored from artifact."
          fi

      - name: Build Desktop Application
        run: node ./scripts/build-electron.js ${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            packages/bruno-electron/out/*.exe
            packages/bruno-electron/out/*.dmg
            packages/bruno-electron/out/*.zip
            packages/bruno-electron/out/*.AppImage
            packages/bruno-electron/out/*.deb
          if-no-files-found: error
          retention-days: 14

  create-release:
    name: Publish GitHub Release
    needs: [build-web, build-desktop]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-downloads

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find release-downloads/ -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp {} release-assets/ \;
          if [ -d "release-downloads/ngaringapi-web-dist" ]; then
            cd release-downloads/ngaringapi-web-dist
            zip -r ../../release-assets/NgaRingApi-Web.zip .
            cd ../..
          fi
          ls -la release-assets/

      - name: Determine Release Tag and Title
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=NgaRingApi ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=v2.1.0-latest" >> $GITHUB_OUTPUT
            echo "title=NgaRingApi v2.1.0 (Latest Build)" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            ### NgaRingApi ${{ steps.release_info.outputs.title }}

            Local-first, git-friendly API IDE and client for modern developers.

            #### What's New:
            - **NgaRing Git Studio Redesign**: Edge-to-edge widescreen workspace with full-screen maximize toggle.
            - **Instant 0ms Git Load**: Zero blocking spinners using Stale-While-Revalidate caching.
            - **Intelligent Diff Viewer**: Syntax-highlighted unified code diff + visual API diff for `.bru` request files.
            - **Conventional Commit Composer**: One-click conventional commit type chips, character counter, and quick shortcuts.
            - **Branding & Theme**: NgaRing cat mascot touchpoints and sleek theme tokens.

            #### Download Assets:
            - **Windows**: `NgaRingApi_2.1.0_x64_win.exe` (NSIS Installer)
            - **macOS**: `NgaRingApi_2.1.0_x64_mac.dmg`, `NgaRingApi_2.1.0_arm64_mac.dmg` & `.zip`
            - **Linux**: `NgaRingApi_2.1.0_x64_linux.AppImage` & `.deb`
            - **Web App**: `NgaRingApi-Web.zip`
          files: release-assets/*
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
