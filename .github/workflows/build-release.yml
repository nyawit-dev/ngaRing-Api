name: CI/CD Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_desktop:
        description: 'Build native desktop packages'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun run setup

      - name: Build Web Application
        run: bun run build:web

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngaringapi-web-dist
          path: packages/bruno-app/dist
          retention-days: 7

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: build-web
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_desktop == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact_name: NgaRingApi-Windows
          - os: macos-latest
            platform: mac
            artifact_name: NgaRingApi-macOS
          - os: ubuntu-latest
            platform: linux
            artifact_name: NgaRingApi-Linux
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun run setup

      - name: Build Web Assets First
        run: bun run build:web

      - name: Build Electron Desktop Package
        run: |
          cd packages/bruno-electron
          npm run dist:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: packages/bruno-electron/out/*
          retention-days: 14
