name: CI/CD Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_desktop:
        description: 'Build native desktop packages'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun run setup

      - name: Build Web Application
        run: bun run build:web

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngaringapi-web-dist
          path: packages/bruno-app/dist
          retention-days: 7

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    needs: build-web
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event.inputs.build_desktop == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact_name: NgaRingApi-Windows-Installer
          - os: macos-15
            platform: mac
            artifact_name: NgaRingApi-macOS-Installer
          - os: ubuntu-latest
            platform: linux
            artifact_name: NgaRingApi-Linux-Packages
      fail-fast: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.platform == 'mac' }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun run setup

      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ngaringapi-web-dist
          path: packages/bruno-app/dist

      - name: Verify or Build Web Assets
        shell: bash
        run: |
          if [ ! -f "packages/bruno-app/dist/index.html" ]; then
            echo "Web build not found in artifact, compiling web assets..."
            bun run build:web
          else
            echo "Web build successfully restored from artifact."
          fi

      - name: Disable Spotlight on macOS
        if: runner.os == 'macOS'
        run: |
          sudo mdutil -a -i off || true

      - name: Build Desktop Application
        run: node ./scripts/build-electron.js ${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            packages/bruno-electron/out/*.exe
            packages/bruno-electron/out/*.dmg
            packages/bruno-electron/out/*.zip
            packages/bruno-electron/out/*.AppImage
            packages/bruno-electron/out/*.deb
            packages/bruno-electron/out/latest*.yml
            packages/bruno-electron/out/*.blockmap
          if-no-files-found: warn
          retention-days: 14

  create-release:
    name: Publish GitHub Release
    needs: [build-web, build-desktop]
    if: always() && needs.build-web.result == 'success' && !cancelled() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release-downloads

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find release-downloads/ -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "latest*.yml" -o -name "*.blockmap" \) -exec cp {} release-assets/ \;
          if [ -d "release-downloads/ngaringapi-web-dist" ]; then
            cd release-downloads/ngaringapi-web-dist
            zip -r ../../release-assets/NgaRingApi-Web.zip .
            cd ../..
          fi
          ls -la release-assets/

      - name: Determine Release Tag and Title
        id: release_info
        run: |
          APP_VERSION=$(node -p "require('./packages/bruno-electron/package.json').version")
          echo "version=${APP_VERSION}" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=NgaRingApi ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=v${APP_VERSION}" >> $GITHUB_OUTPUT
            echo "title=NgaRingApi v${APP_VERSION}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            ### NgaRingApi ${{ steps.release_info.outputs.title }}

            Local-first, git-friendly API IDE and client for modern developers.

            #### What's New in v${{ steps.release_info.outputs.version }}:
            - **Seamless In-App Auto-Updates**: Direct background updates powered by `electron-updater` with live titlebar progress and one-click restart installation (no manual downloading or installer wizard needed).
            - **Performance & Startup Optimization**: Resolved application freezing and 'Not Responding' on launch when loading large workspaces or collections.
            - **Non-blocking Tree Traversal**: Zero-allocation collection loading, O(1) early exit search, and background worker parsing.
            - **TypeScript Migration**: Converted core collections search, sidebar flattening, and export modules to TypeScript for enhanced reliability.
            - **V2 SQLite Cache**: High-performance persistent collection caching enabled by default with intelligent filesystem ignore filters.
            - **Bug Fixes**: Fixed network request timeline reassignment and safe token encryption handling in Electron main process.

            #### Download Assets:
            - **Windows**: `NgaRingApi_${{ steps.release_info.outputs.version }}_x64_win.exe` (NSIS Installer)
            - **macOS**: `NgaRingApi_${{ steps.release_info.outputs.version }}_x64_mac.dmg`, `NgaRingApi_${{ steps.release_info.outputs.version }}_arm64_mac.dmg` & `.zip`
            - **Linux**: `NgaRingApi_${{ steps.release_info.outputs.version }}_x64_linux.AppImage` & `.deb`
            - **Web App**: `NgaRingApi-Web.zip`
          files: release-assets/*
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
